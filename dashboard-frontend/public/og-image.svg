<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="60%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#accent)" opacity="0.5"/>

  <!-- Border accent -->
  <rect x="2" y="2" width="1196" height="626" rx="12" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Radar icon -->
  <g transform="translate(100, 180)">
    <circle cx="60" cy="60" r="55" stroke="#4ade80" stroke-width="2.5" fill="none"/>
    <circle cx="60" cy="60" r="36" stroke="#4ade80" stroke-width="1.5" fill="none" opacity="0.7"/>
    <circle cx="60" cy="60" r="17" stroke="#4ade80" stroke-width="1.5" fill="none" opacity="0.5"/>
    <circle cx="60" cy="60" r="7" fill="#86efac"/>
    <line x1="60" y1="60" x2="60" y2="5" stroke="url(#sweep)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="28" r="6" fill="#ef4444" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title -->
  <text x="260" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#f1f5f9">
    PanicRadar.ai
  </text>

  <!-- Tagline -->
  <text x="260" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#4ade80">
    See the panic before the crowd.
  </text>

  <!-- Description -->
  <text x="260" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">
    Real-time contrarian signals from 30+ crypto communities.
  </text>
  <text x="260" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">
    Bayesian intelligence detects when extreme fear = opportunity.
  </text>

  <!-- Score widget -->
  <g transform="translate(100, 420)">
    <rect width="1000" height="120" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

    <!-- Panic score -->
    <text x="40" y="45" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" font-weight="600" text-transform="uppercase" letter-spacing="2">LIVE PANIC SCORE</text>
    <text x="40" y="90" font-family="system-ui, sans-serif" font-size="48" font-weight="800" fill="#f97316">53.4</text>
    <text x="195" y="90" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8">Elevated</text>

    <!-- Divider -->
    <line x1="340" y1="20" x2="340" y2="100" stroke="#334155" stroke-width="1"/>

    <!-- Stats -->
    <text x="380" y="45" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" font-weight="600">30+ SOURCES</text>
    <text x="380" y="90" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Bayesian-weighted sentiment</text>

    <line x1="580" y1="20" x2="580" y2="100" stroke="#334155" stroke-width="1"/>

    <text x="620" y="45" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" font-weight="600">FEAR &amp; GREED</text>
    <text x="620" y="85" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#ef4444">6</text>
    <text x="658" y="85" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">Extreme Fear</text>

    <line x1="820" y1="20" x2="820" y2="100" stroke="#334155" stroke-width="1"/>

    <text x="860" y="45" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" font-weight="600">24H VOLATILITY</text>
    <text x="860" y="85" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#ef4444">95.5%</text>
  </g>

  <!-- Bottom bar gradient -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#bar)"/>
</svg>

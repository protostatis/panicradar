# Access log with persistent path (volume-mounted in production)
access_log /var/log/nginx/access.log combined;

# HTTP - Redirect to HTTPS
server {
    listen 80;
    server_name panicradar.ai www.panicradar.ai;

    # IP blocklist (volume-mounted, editable without rebuild)
    include /etc/nginx/conf.d/blocklist.conf;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main server
server {
    listen 443 ssl http2;
    server_name panicradar.ai www.panicradar.ai;
    root /usr/share/nginx/html;
    index index.html;

    # IP blocklist (volume-mounted, editable without rebuild)
    include /etc/nginx/conf.d/blocklist.conf;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/panicradar.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panicradar.ai/privkey.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # API proxy - forward to backend (no caching)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        # Prevent caching of API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://api:8000/health;
    }

    # Block common scanner probes
    location ~ /\.(git|env|aws|DS_Store) {
        return 404;
    }
    location ~* (wp-login|xmlrpc|phpmyadmin|wp-includes|wp-content|eval-stdin) {
        return 404;
    }

    # Social bio redirects with UTM attribution
    location = /tiktok {
        return 302 "https://panicradar.ai/?utm_source=tiktok&utm_medium=social&utm_campaign=bio";
    }

    # Static files - React SPA
    location / {
        try_files $uri $uri/ /index.html;
        # Don't cache HTML
        add_header Cache-Control "no-cache";
    }

    # HTML files - no cache
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

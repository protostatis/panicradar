services:
  # ============================================
  # Crawler Service - Background sentiment crawler
  # ============================================
  crawler:
    build:
      context: .
      target: crawler
      args:
        - TORCH_BASE_IMAGE=${TORCH_BASE_IMAGE:-ghcr.io/protostatis/crypto-sentiment-torch-base:latest}
    container_name: crypto-crawler
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DATABASE_PATH=/app/data/sentiment.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}
      - REDDIT_USER_AGENT=${REDDIT_USER_AGENT:-crypto_sentiment_crawler/1.0}
      - WHALE_ALERT_API_KEY=${WHALE_ALERT_API_KEY:-}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY:-}
      - PROXY_URL=${PROXY_URL:-}
      # Embedding backend (opt-in OpenRouter):
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-local}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    depends_on:
      - api
    networks:
      - crypto-net
    healthcheck:
      test: ["CMD", "test", "-f", "/app/data/sentiment.db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # API Service - FastAPI backend
  # ============================================
  api:
    build:
      context: .
      target: api
    container_name: crypto-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DATABASE_PATH=/app/data/sentiment.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - crypto-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Frontend - React Dashboard
  # ============================================
  frontend:
    build:
      context: ./dashboard-frontend
      target: production
      args:
        - VITE_API_URL=
    container_name: crypto-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./dashboard-frontend/blocklist.conf:/etc/nginx/conf.d/blocklist.conf:ro
    depends_on:
      - api
      - game-server
    networks:
      - crypto-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Game Server - BlockCoined V2 PvP WebSocket
  # ============================================
  game-server:
    build:
      context: ./dashboard-frontend/game
      dockerfile: server/Dockerfile
    container_name: crypto-game-server
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://panicradar.ai,https://www.panicradar.ai}
    networks:
      - crypto-net
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');http.get('http://localhost:8080/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 50

  # ============================================
  # Signals Bot - Telegram bot + signal alerts
  # ============================================
  signals:
    build:
      context: .
      target: base
      args:
        - TORCH_BASE_IMAGE=${TORCH_BASE_IMAGE:-ghcr.io/protostatis/crypto-sentiment-torch-base:latest}
    container_name: crypto-signals
    restart: unless-stopped
    command: ["uv", "run", "signals", "bot"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DB_PATH=/app/data/sentiment.db
      - SIGNAL_CHECK_INTERVAL=${SIGNAL_CHECK_INTERVAL:-30}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID:-@PanicRadarAlerts}
    depends_on:
      - api
    networks:
      - crypto-net

  # ============================================
  # Backfill Service - One-time historical data
  # ============================================
  backfill:
    build:
      context: .
      target: backfill
      args:
        - TORCH_BASE_IMAGE=${TORCH_BASE_IMAGE:-ghcr.io/protostatis/crypto-sentiment-torch-base:latest}
    container_name: crypto-backfill
    profiles:
      - backfill  # Only run with: docker compose --profile backfill up backfill
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DATABASE_PATH=/app/data/sentiment.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - crypto-net

  # ============================================
  # Gap Backfill - Fill missing daily data
  # ============================================
  gap-backfill:
    build:
      context: .
      target: base
      args:
        - TORCH_BASE_IMAGE=${TORCH_BASE_IMAGE:-ghcr.io/protostatis/crypto-sentiment-torch-base:latest}
    container_name: crypto-gap-backfill
    profiles:
      - backfill
    command: ["uv", "run", "python", "-m", "crypto_sentiment_crawler.backfill_gaps"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DATABASE_PATH=/app/data/sentiment.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - crypto-net

  # ============================================
  # User Score Backfill - Score existing posts
  # ============================================
  score-backfill:
    build:
      context: .
      target: base
      args:
        - TORCH_BASE_IMAGE=${TORCH_BASE_IMAGE:-ghcr.io/protostatis/crypto-sentiment-torch-base:latest}
    container_name: crypto-score-backfill
    profiles:
      - backfill
    command: >
      uv run python -c "
      from crypto_sentiment_crawler.processing.user_sentiment import backfill_user_scores;
      backfill_user_scores('/app/data/sentiment.db')
      "
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DATABASE_PATH=/app/data/sentiment.db
      # Embedding backend (opt-in OpenRouter):
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-local}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    networks:
      - crypto-net

networks:
  crypto-net:
    driver: bridge

volumes:
  data:
  logs:

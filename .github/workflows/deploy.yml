name: Deploy

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/crypto-sentiment

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push crawler image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: crawler
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-crawler:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-crawler:latest
          build-args: |
            TORCH_BASE_IMAGE=${{ env.REGISTRY }}/protostatis/crypto-sentiment-torch-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard-frontend
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push game server image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard-frontend/game
          file: ./dashboard-frontend/game/server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-game-server:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-game-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          RESIDENTIAL_PROXY: ${{ secrets.RESIDENTIAL_PROXY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          envs: RESIDENTIAL_PROXY
          script: |
            set -e

            echo "========== DEPLOYMENT START: ${{ github.ref_name }} =========="

            cd /home/ec2-user/crypto_sentiment_crawler

            if [ -z "${RESIDENTIAL_PROXY:-}" ]; then
              echo "ERROR: RESIDENTIAL_PROXY must be configured before a production deployment."
              exit 1
            fi

            # Bright Data authenticates this proxy from the EC2 public egress.
            # Do not tunnel the proxy connection through a Mullvad exit IP.
            echo "Disabling WireGuard for direct residential-proxy egress."
            sudo systemctl stop wg-quick@wg0 2>/dev/null || true
            sudo wg-quick down wg0 2>/dev/null || true
            sudo systemctl disable wg-quick@wg0 2>/dev/null || true

            # wg-quick can leave the host pointed at VPN DNS after shutdown.
            # Recover DNS before GitHub/GHCR operations on the direct EC2 path.
            if ! getent hosts github.com >/dev/null || ! getent hosts ghcr.io >/dev/null; then
              sudo systemctl restart systemd-resolved 2>/dev/null || true

              DEFAULT_IFACE=$(/sbin/ip route get 1.1.1.1 2>/dev/null | awk '{for (i=1;i<=NF;i++) if ($i=="dev") {print $(i+1); exit}}')
              if [ -n "$DEFAULT_IFACE" ] && command -v resolvectl >/dev/null 2>&1; then
                sudo resolvectl revert wg0 2>/dev/null || true
                sudo resolvectl dns "$DEFAULT_IFACE" 169.254.169.253 1.1.1.1 8.8.8.8 2>/dev/null || true
                sudo resolvectl domain "$DEFAULT_IFACE" "~." 2>/dev/null || true
                sudo resolvectl flush-caches 2>/dev/null || true
              fi

              if ! getent hosts github.com >/dev/null || ! getent hosts ghcr.io >/dev/null; then
                echo "systemd DNS recovery did not resolve GitHub hosts; trying /etc/resolv.conf fallback."
                if ! sudo sh -c 'printf "nameserver 169.254.169.253\nnameserver 1.1.1.1\nnameserver 8.8.8.8\noptions timeout:2 attempts:3\n" > /etc/resolv.conf' 2>/dev/null; then
                  echo "WARNING: Could not write /etc/resolv.conf; continuing to final DNS check."
                fi
              fi
            fi
            getent hosts github.com >/dev/null
            getent hosts ghcr.io >/dev/null

            # Pull latest code. Preserve any EC2-local edits so deployment can
            # move to the release tag without discarding operational changes.
            git fetch --tags origin
            if [ -n "$(git status --porcelain)" ]; then
              STASH_NAME="pre-deploy-${{ github.ref_name }}-$(date -u +%Y%m%dT%H%M%SZ)"
              git stash push --include-untracked -m "$STASH_NAME"
              echo "Stashed EC2 local worktree changes: $STASH_NAME"
            fi
            git checkout ${{ github.ref_name }}

            # Ensure directories exist
            sudo mkdir -p /opt/crypto-sentiment/data /opt/crypto-sentiment/backups /opt/crypto-sentiment/logs
            sudo chown -R ec2-user:ec2-user /opt/crypto-sentiment

            CRAWLER_ENV_ARGS=""
            if [ -f /opt/crypto-sentiment/.env ]; then
              CRAWLER_ENV_ARGS="--env-file /opt/crypto-sentiment/.env"
            else
              echo "WARNING: /opt/crypto-sentiment/.env not found; crawler will run without local env config"
            fi

            # ========== PRE-DEPLOYMENT BACKUP ==========
            if [ -f /opt/crypto-sentiment/data/sentiment.db ]; then
              BACKUP_NAME="sentiment_predeploy_$(date +%Y%m%d_%H%M%S).db"
              cp /opt/crypto-sentiment/data/sentiment.db /opt/crypto-sentiment/backups/$BACKUP_NAME
              echo "Created pre-deploy backup: $BACKUP_NAME"
              # Keep only last 14 backups
              ls -t /opt/crypto-sentiment/backups/sentiment_*.db 2>/dev/null | tail -n +15 | xargs -r rm
            fi

            # Seed state files if missing
            [ ! -f /opt/crypto-sentiment/data/orchestrator_state.json ] && cp data/orchestrator_state.json /opt/crypto-sentiment/data/ && echo "Seeded orchestrator_state.json"
            [ ! -f /opt/crypto-sentiment/data/discovery_state.json ] && cp data/discovery_state.json /opt/crypto-sentiment/data/ 2>/dev/null || true

            # ========== DISK SPACE CHECK & CLEANUP ==========
            echo "Pre-cleanup disk usage:"
            df -h /

            # Aggressive cleanup - remove ALL unused images (not just old ones)
            docker system prune -af || true
            docker builder prune -af || true

            echo "Post-cleanup disk usage:"
            AVAIL_GB=$(df / | tail -1 | awk '{print $4}' | sed 's/G//')
            df -h /

            # Require at least 8GB free (images are ~7GB total)
            if [ "$AVAIL_GB" -lt 8000000 ]; then
              echo "ERROR: Insufficient disk space. Need 8GB, have ${AVAIL_GB}KB"
              exit 1
            fi
            echo "Disk space OK: ${AVAIL_GB}KB available"

            # ========== DOCKER LOGIN & PULL ==========
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Pulling images..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-crawler:latest
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-game-server:latest

            # Tag images for local use
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-crawler:latest crypto-sentiment-crawler:latest
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest crypto-sentiment-api:latest
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest crypto-sentiment-frontend:latest
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-game-server:latest crypto-sentiment-game-server:latest

            # ========== ENSURE NETWORK EXISTS ==========
            docker network create --subnet=172.18.0.0/16 crypto-sentiment_crypto-net 2>/dev/null || echo "Network already exists"

            # Verify the release image can reach crawlable Reddit HTML through
            # the residential proxy before replacing the running services.
            echo "Checking Reddit proxy access before replacing containers..."
            if ! PROXY_URL="$RESIDENTIAL_PROXY" docker run --rm \
              --network crypto-sentiment_crypto-net \
              -e PROXY_URL \
              crypto-sentiment-crawler:latest \
              uv run python -c '
            import asyncio
            import os

            import httpx


            async def fetch(client: httpx.AsyncClient, url: str) -> httpx.Response:
                try:
                    return await client.get(
                        url,
                        headers={"User-Agent": "Mozilla/5.0"},
                    )
                except httpx.ProxyError:
                    raise RuntimeError("Residential proxy transport failed (proxy_error)") from None
                except httpx.ConnectTimeout:
                    raise RuntimeError("Residential proxy transport failed (connect_timeout)") from None
                except httpx.ReadTimeout:
                    raise RuntimeError("Residential proxy transport failed (read_timeout)") from None
                except httpx.ConnectError:
                    raise RuntimeError("Residential proxy transport failed (connect_error)") from None
                except httpx.RemoteProtocolError:
                    raise RuntimeError("Residential proxy transport failed (remote_protocol_error)") from None
                except httpx.NetworkError:
                    raise RuntimeError("Residential proxy transport failed (network_error)") from None


            async def main() -> None:
                try:
                    client = httpx.AsyncClient(
                        timeout=httpx.Timeout(15.0),
                        follow_redirects=True,
                        proxy=os.environ["PROXY_URL"],
                    )
                except Exception:
                    raise RuntimeError("Residential proxy configuration failed") from None

                async with client:
                    neutral = await fetch(client, "https://example.com/")
                    if neutral.status_code != 200:
                        raise RuntimeError(
                            f"Residential proxy neutral canary returned HTTP {neutral.status_code}"
                        )

                    reddit = await fetch(client, "https://old.reddit.com/r/bitcoin/new/")
                if reddit.status_code != 200:
                    raise RuntimeError(
                        f"Reddit proxy canary returned HTTP {reddit.status_code}"
                    )
                if "data-timestamp" not in reddit.text:
                    raise RuntimeError("Reddit proxy canary returned unexpected listing markup")


            asyncio.run(main())
            '; then
              echo "ERROR: Reddit proxy canary failed; keeping existing services running."
              exit 1
            fi

            # ========== SYNC CONFIG FILES ==========
            mkdir -p /opt/crypto-sentiment/dashboard-frontend
            cp dashboard-frontend/blocklist.conf /opt/crypto-sentiment/dashboard-frontend/blocklist.conf

            # ========== STOP OLD CONTAINERS ==========
            echo "Stopping old containers..."
            docker stop crypto-crawler crypto-api crypto-frontend crypto-signals crypto-game-server 2>/dev/null || true
            docker rm crypto-crawler crypto-api crypto-frontend crypto-signals crypto-game-server 2>/dev/null || true

            # ========== START SERVICES ==========
            echo "Starting API..."
            docker run -d --name crypto-api --restart unless-stopped \
              -p 8000:8000 \
              --network crypto-sentiment_crypto-net \
              --network-alias api \
              -v /opt/crypto-sentiment/data:/app/data \
              -v /opt/crypto-sentiment/logs:/app/logs \
              -e DATABASE_PATH=/app/data/sentiment.db \
              crypto-sentiment-api:latest

            # Wait for API to be healthy with actual health check
            echo "Waiting for API to be healthy..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "API is healthy!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "ERROR: API failed to become healthy"
                docker logs crypto-api --tail 50
                exit 1
              fi
              echo "Waiting for API... ($i/30)"
              sleep 2
            done

            echo "Starting game server..."
            docker run -d --name crypto-game-server --restart unless-stopped \
              --network crypto-sentiment_crypto-net \
              --network-alias game-server \
              --cpus 0.5 \
              --memory 256m \
              --pids-limit 50 \
              -e NODE_ENV=production \
              -e ALLOWED_ORIGINS=https://panicradar.ai,https://www.panicradar.ai \
              crypto-sentiment-game-server:latest

            # Wait for game server health
            echo "Waiting for game server to be healthy..."
            for i in $(seq 1 15); do
              GAME_HEALTH=$(docker inspect --format '{{.State.Health.Status}}' crypto-game-server 2>/dev/null || echo "missing")
              if [ "$GAME_HEALTH" = "healthy" ]; then
                echo "Game server is healthy!"
                break
              fi
              if [ $i -eq 15 ]; then
                echo "ERROR: Game server health check failed (status: $GAME_HEALTH)"
                docker logs crypto-game-server --tail 50
                exit 1
              fi
              sleep 2
            done

            # Nginx resolves the game-server network alias at startup, so the
            # upstream container must be healthy before frontend starts.
            echo "Starting frontend..."
            docker run -d --name crypto-frontend --restart unless-stopped \
              -p 80:80 -p 443:443 \
              --network crypto-sentiment_crypto-net \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              -v /opt/crypto-sentiment/logs:/var/log/nginx \
              -v /opt/crypto-sentiment/dashboard-frontend/blocklist.conf:/etc/nginx/conf.d/blocklist.conf:ro \
              crypto-sentiment-frontend:latest

            echo "Starting crawler..."
            PROXY_URL="$RESIDENTIAL_PROXY" docker run -d --name crypto-crawler --restart unless-stopped \
              --network crypto-sentiment_crypto-net \
              $CRAWLER_ENV_ARGS \
              -v /opt/crypto-sentiment/data:/app/data \
              -v /opt/crypto-sentiment/logs:/app/logs \
              -e DATABASE_PATH=/app/data/sentiment.db \
              -e PROXY_URL \
              -e RESIDENTIAL_PROXY= \
              crypto-sentiment-crawler:latest \
              uv run crawler background --crawl-interval 60
            unset RESIDENTIAL_PROXY

            echo "Starting signals bot..."
            docker run -d --name crypto-signals --restart unless-stopped \
              --network crypto-sentiment_crypto-net \
              -v /opt/crypto-sentiment/data:/app/data \
              -v /opt/crypto-sentiment/logs:/app/logs \
              -e TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }} \
              -e DB_PATH=/app/data/sentiment.db \
              -e SIGNAL_CHECK_INTERVAL=30 \
              -e TELEGRAM_CHANNEL_ID=@PanicRadarAlerts \
              crypto-sentiment-crawler:latest \
              uv run signals bot

            # ========== POST-DEPLOY CLEANUP ==========
            echo "Cleaning up unused images..."
            docker image prune -af

            echo "Post-deploy disk usage:"
            df -h /

            # ========== VERIFY DEPLOYMENT ==========
            echo "Verifying all containers are running..."
            sleep 5

            RUNNING=$(docker ps --format '{{.Names}}' | grep -E '^crypto-(api|frontend|crawler|signals|game-server)$' | wc -l)
            if [ "$RUNNING" -ne 5 ]; then
              echo "ERROR: Not all containers are running!"
              docker ps -a
              exit 1
            fi

            echo "All 5 containers running. Checking frontend..."
            if ! curl -sf -o /dev/null https://localhost --insecure 2>/dev/null; then
              echo "WARNING: Frontend HTTPS check failed (may be normal if cert issue)"
            fi

            # ========== SETUP CRON ==========
            chmod +x deploy/backup-db.sh
            chmod +x scripts/daily_traffic_report.sh
            sudo mkdir -p /opt/crypto-sentiment/reports

            BACKUP_CRON="0 0 * * * /home/ec2-user/crypto_sentiment_crawler/deploy/backup-db.sh >> /opt/crypto-sentiment/logs/backup.log 2>&1"
            TRAFFIC_CRON="5 0 * * * REPORT_EMAIL_TO=protostatis.dev@gmail.com REPORT_EMAIL_FROM=protostatis.dev@gmail.com /home/ec2-user/crypto_sentiment_crawler/scripts/daily_traffic_report.sh >> /opt/crypto-sentiment/logs/traffic_report.log 2>&1"
            MORNING_TRAFFIC_CRON="0 12 * * * REPORT_EMAIL_TO=protostatis.dev@gmail.com REPORT_EMAIL_FROM=protostatis.dev@gmail.com /home/ec2-user/crypto_sentiment_crawler/scripts/daily_traffic_report.sh --date \$(date -u +\%Y-\%m-\%d) >> /opt/crypto-sentiment/logs/traffic_report.log 2>&1"
            (crontab -l 2>/dev/null | grep -v "backup-db.sh" | grep -v "daily_traffic_report.sh"; echo "$BACKUP_CRON"; echo "$TRAFFIC_CRON"; echo "$MORNING_TRAFFIC_CRON") | crontab -

            echo "========== DEPLOYMENT COMPLETE =========="
            docker ps

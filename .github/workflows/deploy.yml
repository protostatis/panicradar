name: Deploy

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/crypto-sentiment

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push crawler image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: crawler
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-crawler:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-crawler:latest
          build-args: |
            TORCH_BASE_IMAGE=${{ env.REGISTRY }}/protostatis/crypto-sentiment-torch-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard-frontend
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            echo "========== DEPLOYMENT START: ${{ github.ref_name }} =========="

            cd /home/ec2-user/crypto_sentiment_crawler

            # Pull latest code. Preserve any EC2-local edits so deployment can
            # move to the release tag without discarding operational changes.
            git fetch --tags origin
            if [ -n "$(git status --porcelain)" ]; then
              STASH_NAME="pre-deploy-${{ github.ref_name }}-$(date -u +%Y%m%dT%H%M%SZ)"
              git stash push --include-untracked -m "$STASH_NAME"
              echo "Stashed EC2 local worktree changes: $STASH_NAME"
            fi
            git checkout ${{ github.ref_name }}

            # Ensure directories exist
            sudo mkdir -p /opt/crypto-sentiment/data /opt/crypto-sentiment/backups /opt/crypto-sentiment/logs
            sudo chown -R ec2-user:ec2-user /opt/crypto-sentiment

            # ========== PRE-DEPLOYMENT BACKUP ==========
            if [ -f /opt/crypto-sentiment/data/sentiment.db ]; then
              BACKUP_NAME="sentiment_predeploy_$(date +%Y%m%d_%H%M%S).db"
              cp /opt/crypto-sentiment/data/sentiment.db /opt/crypto-sentiment/backups/$BACKUP_NAME
              echo "Created pre-deploy backup: $BACKUP_NAME"
              # Keep only last 14 backups
              ls -t /opt/crypto-sentiment/backups/sentiment_*.db 2>/dev/null | tail -n +15 | xargs -r rm
            fi

            # Seed state files if missing
            [ ! -f /opt/crypto-sentiment/data/orchestrator_state.json ] && cp data/orchestrator_state.json /opt/crypto-sentiment/data/ && echo "Seeded orchestrator_state.json"
            [ ! -f /opt/crypto-sentiment/data/discovery_state.json ] && cp data/discovery_state.json /opt/crypto-sentiment/data/ 2>/dev/null || true

            # ========== DISK SPACE CHECK & CLEANUP ==========
            echo "Pre-cleanup disk usage:"
            df -h /

            # Aggressive cleanup - remove ALL unused images (not just old ones)
            docker system prune -af || true
            docker builder prune -af || true

            echo "Post-cleanup disk usage:"
            AVAIL_GB=$(df / | tail -1 | awk '{print $4}' | sed 's/G//')
            df -h /

            # Require at least 8GB free (images are ~7GB total)
            if [ "$AVAIL_GB" -lt 8000000 ]; then
              echo "ERROR: Insufficient disk space. Need 8GB, have ${AVAIL_GB}KB"
              exit 1
            fi
            echo "Disk space OK: ${AVAIL_GB}KB available"

            # ========== DOCKER LOGIN & PULL ==========
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Pulling images..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-crawler:latest
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest

            # Tag images for local use
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-crawler:latest crypto-sentiment-crawler:latest
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest crypto-sentiment-api:latest
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest crypto-sentiment-frontend:latest

            # ========== ENSURE NETWORK EXISTS ==========
            docker network create --subnet=172.18.0.0/16 crypto-sentiment_crypto-net 2>/dev/null || echo "Network already exists"

            # ========== SYNC CONFIG FILES ==========
            mkdir -p /opt/crypto-sentiment/dashboard-frontend
            cp dashboard-frontend/blocklist.conf /opt/crypto-sentiment/dashboard-frontend/blocklist.conf

            # ========== STOP OLD CONTAINERS ==========
            echo "Stopping old containers..."
            docker stop crypto-crawler crypto-api crypto-frontend crypto-signals 2>/dev/null || true
            docker rm crypto-crawler crypto-api crypto-frontend crypto-signals 2>/dev/null || true

            # ========== START SERVICES ==========
            echo "Starting API..."
            docker run -d --name crypto-api --restart unless-stopped \
              -p 8000:8000 \
              --network crypto-sentiment_crypto-net \
              --network-alias api \
              -v /opt/crypto-sentiment/data:/app/data \
              -v /opt/crypto-sentiment/logs:/app/logs \
              -e DATABASE_PATH=/app/data/sentiment.db \
              crypto-sentiment-api:latest

            # Wait for API to be healthy with actual health check
            echo "Waiting for API to be healthy..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "API is healthy!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "ERROR: API failed to become healthy"
                docker logs crypto-api --tail 50
                exit 1
              fi
              echo "Waiting for API... ($i/30)"
              sleep 2
            done

            echo "Starting frontend..."
            docker run -d --name crypto-frontend --restart unless-stopped \
              -p 80:80 -p 443:443 \
              --network crypto-sentiment_crypto-net \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              -v /opt/crypto-sentiment/logs:/var/log/nginx \
              -v /opt/crypto-sentiment/dashboard-frontend/blocklist.conf:/etc/nginx/conf.d/blocklist.conf:ro \
              crypto-sentiment-frontend:latest

            echo "Starting crawler..."
            docker run -d --name crypto-crawler --restart unless-stopped \
              --network crypto-sentiment_crypto-net \
              -v /opt/crypto-sentiment/data:/app/data \
              -v /opt/crypto-sentiment/logs:/app/logs \
              -e DATABASE_PATH=/app/data/sentiment.db \
              -e PROXY_URL= \
              crypto-sentiment-crawler:latest \
              uv run crawler background --crawl-interval 60

            echo "Starting signals bot..."
            docker run -d --name crypto-signals --restart unless-stopped \
              --network crypto-sentiment_crypto-net \
              -v /opt/crypto-sentiment/data:/app/data \
              -v /opt/crypto-sentiment/logs:/app/logs \
              -e TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }} \
              -e DB_PATH=/app/data/sentiment.db \
              -e SIGNAL_CHECK_INTERVAL=30 \
              -e TELEGRAM_CHANNEL_ID=@PanicRadarAlerts \
              crypto-sentiment-crawler:latest \
              uv run signals bot

            # ========== POST-DEPLOY CLEANUP ==========
            echo "Cleaning up unused images..."
            docker image prune -af

            echo "Post-deploy disk usage:"
            df -h /

            # ========== VERIFY DEPLOYMENT ==========
            echo "Verifying all containers are running..."
            sleep 5

            RUNNING=$(docker ps --format '{{.Names}}' | grep -E '^crypto-(api|frontend|crawler|signals)$' | wc -l)
            if [ "$RUNNING" -ne 4 ]; then
              echo "ERROR: Not all containers are running!"
              docker ps -a
              exit 1
            fi

            echo "All 4 containers running. Checking frontend..."
            if ! curl -sf -o /dev/null https://localhost --insecure 2>/dev/null; then
              echo "WARNING: Frontend HTTPS check failed (may be normal if cert issue)"
            fi

            # ========== SETUP CRON ==========
            chmod +x deploy/backup-db.sh
            chmod +x scripts/daily_traffic_report.sh
            sudo mkdir -p /opt/crypto-sentiment/reports

            BACKUP_CRON="0 0 * * * /home/ec2-user/crypto_sentiment_crawler/deploy/backup-db.sh >> /opt/crypto-sentiment/logs/backup.log 2>&1"
            TRAFFIC_CRON="5 0 * * * REPORT_EMAIL_TO=protostatis.dev@gmail.com REPORT_EMAIL_FROM=protostatis.dev@gmail.com /home/ec2-user/crypto_sentiment_crawler/scripts/daily_traffic_report.sh >> /opt/crypto-sentiment/logs/traffic_report.log 2>&1"
            MORNING_TRAFFIC_CRON="0 12 * * * REPORT_EMAIL_TO=protostatis.dev@gmail.com REPORT_EMAIL_FROM=protostatis.dev@gmail.com /home/ec2-user/crypto_sentiment_crawler/scripts/daily_traffic_report.sh --date \$(date -u +\%Y-\%m-\%d) >> /opt/crypto-sentiment/logs/traffic_report.log 2>&1"
            (crontab -l 2>/dev/null | grep -v "backup-db.sh" | grep -v "daily_traffic_report.sh"; echo "$BACKUP_CRON"; echo "$TRAFFIC_CRON"; echo "$MORNING_TRAFFIC_CRON") | crontab -

            echo "========== DEPLOYMENT COMPLETE =========="
            docker ps

name: Deploy

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/crypto-sentiment

concurrency:
  group: ${{ github.repository }}-production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push crawler image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: crawler
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-crawler:${{ steps.meta.outputs.version }}
          build-args: |
            TORCH_BASE_IMAGE=${{ env.REGISTRY }}/protostatis/crypto-sentiment-torch-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard-frontend
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push game server image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard-frontend/game
          file: ./dashboard-frontend/game/server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-game-server:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_IMAGE_TAG: ${{ needs.build-and-push.outputs.version }}
      GHCR_ACTOR: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 45m
          envs: RELEASE_TAG,RELEASE_IMAGE_TAG,REGISTRY,IMAGE_PREFIX,GHCR_ACTOR,GHCR_TOKEN,TELEGRAM_BOT_TOKEN
          script: |
            set -e
            echo "========== DEPLOYMENT BOOTSTRAP: $RELEASE_TAG =========="
            cd /home/ec2-user/crypto_sentiment_crawler

            # Restore direct EC2 egress before the DNS-dependent tag fetch.
            sudo systemctl disable --now wg-quick@wg0 >/dev/null 2>&1 || true
            if /sbin/ip link show wg0 >/dev/null 2>&1; then
              if ! command -v wg-quick >/dev/null 2>&1; then
                echo "ERROR: wg0 is active but wg-quick is unavailable"
                exit 1
              fi
              sudo wg-quick down wg0
            fi
            if /sbin/ip link show wg0 >/dev/null 2>&1; then
              echo "ERROR: Legacy WireGuard interface is still active"
              exit 1
            fi
            WG_UNIT_STATE=$(sudo systemctl is-enabled wg-quick@wg0 2>/dev/null || true)
            case "$WG_UNIT_STATE" in
              enabled|enabled-runtime|linked|linked-runtime)
                echo "ERROR: Legacy WireGuard service remains enabled ($WG_UNIT_STATE)"
                exit 1
                ;;
            esac
            sudo rm -f /etc/wireguard/wg0.conf
            timeout 15 getent ahostsv4 github.com >/dev/null
            curl -fsS --connect-timeout 5 --max-time 15 \
              https://github.com/robots.txt >/dev/null

            git fetch --tags origin
            if [ -n "$(git status --porcelain)" ]; then
              STASH_NAME="pre-deploy-${RELEASE_TAG}-$(date -u +%Y%m%dT%H%M%SZ)"
              git stash push --include-untracked -m "$STASH_NAME"
              echo "Stashed EC2 local worktree changes: $STASH_NAME"
            fi
            git checkout "$RELEASE_TAG"
            bash deploy/release.sh

  promote-latest:
    name: Promote Verified Images
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote deployed release to latest
        run: |
          set -e
          VERSION="${{ needs.build-and-push.outputs.version }}"
          for component in crawler api frontend game-server; do
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-$component"
            docker buildx imagetools create \
              --tag "$IMAGE:latest" \
              "$IMAGE:$VERSION"
          done

name: Deploy

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/crypto-sentiment

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push crawler image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: crawler
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-crawler:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-crawler:latest
          build-args: |
            TORCH_BASE_IMAGE=${{ env.REGISTRY }}/protostatis/crypto-sentiment-torch-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard-frontend
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push game server image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard-frontend/game
          file: ./dashboard-frontend/game/server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-game-server:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-game-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            echo "========== DEPLOYMENT START: ${{ github.ref_name }} =========="

            cd /home/ec2-user/crypto_sentiment_crawler

            # Keep WireGuard active for non-Reddit crawler dependencies. Reddit
            # HTML is fetched by Unbrowser with a local cookie refresh socket.

            # Pull latest code. Preserve any EC2-local edits so deployment can
            # move to the release tag without discarding operational changes.
            git fetch --tags origin
            if [ -n "$(git status --porcelain)" ]; then
              STASH_NAME="pre-deploy-${{ github.ref_name }}-$(date -u +%Y%m%dT%H%M%SZ)"
              git stash push --include-untracked -m "$STASH_NAME"
              echo "Stashed EC2 local worktree changes: $STASH_NAME"
            fi
            git checkout ${{ github.ref_name }}

            # Ensure directories exist
            sudo mkdir -p /opt/crypto-sentiment/data /opt/crypto-sentiment/backups /opt/crypto-sentiment/logs /opt/crypto-sentiment/run
            sudo chown -R ec2-user:ec2-user /opt/crypto-sentiment

            CRAWLER_ENV_ARGS=""
            if [ -f /opt/crypto-sentiment/.env ]; then
              CRAWLER_ENV_ARGS="--env-file /opt/crypto-sentiment/.env"
            else
              echo "WARNING: /opt/crypto-sentiment/.env not found; crawler will run without local env config"
            fi

            # ========== PRE-DEPLOYMENT BACKUP ==========
            if [ -f /opt/crypto-sentiment/data/sentiment.db ]; then
              BACKUP_NAME="sentiment_predeploy_$(date +%Y%m%d_%H%M%S).db"
              cp /opt/crypto-sentiment/data/sentiment.db /opt/crypto-sentiment/backups/$BACKUP_NAME
              echo "Created pre-deploy backup: $BACKUP_NAME"
              # Keep only last 14 backups
              ls -t /opt/crypto-sentiment/backups/sentiment_*.db 2>/dev/null | tail -n +15 | xargs -r rm
            fi

            # Seed state files if missing
            [ ! -f /opt/crypto-sentiment/data/orchestrator_state.json ] && cp data/orchestrator_state.json /opt/crypto-sentiment/data/ && echo "Seeded orchestrator_state.json"
            [ ! -f /opt/crypto-sentiment/data/discovery_state.json ] && cp data/discovery_state.json /opt/crypto-sentiment/data/ 2>/dev/null || true

            # ========== DISK SPACE CHECK & CLEANUP ==========
            echo "Pre-cleanup disk usage:"
            df -h /

            # Aggressive cleanup - remove ALL unused images (not just old ones)
            docker system prune -af || true
            docker builder prune -af || true

            echo "Post-cleanup disk usage:"
            AVAIL_GB=$(df / | tail -1 | awk '{print $4}' | sed 's/G//')
            df -h /

            # Require at least 8GB free (images are ~7GB total)
            if [ "$AVAIL_GB" -lt 8000000 ]; then
              echo "ERROR: Insufficient disk space. Need 8GB, have ${AVAIL_GB}KB"
              exit 1
            fi
            echo "Disk space OK: ${AVAIL_GB}KB available"

            # ========== DOCKER LOGIN & PULL ==========
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            RELEASE_IMAGE_TAG="${{ needs.build-and-push.outputs.version }}"
            REMOTE_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}"
            if [ -z "$RELEASE_IMAGE_TAG" ]; then
              echo "ERROR: Release image tag was not produced."
              exit 1
            fi

            echo "Pulling immutable release images ($RELEASE_IMAGE_TAG)..."
            for component in crawler api frontend game-server; do
              local_image="crypto-sentiment-$component"
              remote_image="$REMOTE_IMAGE-$component:$RELEASE_IMAGE_TAG"
              # `latest` advances only after a verified deployment, so it is
              # the known-good image even if a prior candidate pull failed.
              if docker image inspect "$local_image:latest" >/dev/null 2>&1; then
                docker tag "$local_image:latest" "$local_image:previous"
              fi
              docker pull "$remote_image"
              docker tag "$remote_image" "$local_image:current"
              docker image rm "$remote_image" >/dev/null || true
            done

            # ========== ENSURE NETWORK EXISTS ==========
            docker network create --subnet=172.18.0.0/16 crypto-sentiment_crypto-net 2>/dev/null || echo "Network already exists"

            # The local Mac's solver is forwarded as a mode-0600 Unix socket.
            # A solver outage degrades only Reddit collection; it must not block
            # unrelated API, frontend, or security releases.
            REDDIT_SOCKET=/opt/crypto-sentiment/run/reddit-cookie-solver.sock
            REDDIT_CRAWLER_ARGS="-e REDDIT_FETCH_MODE=standard -e UNBROWSER_COOKIE_SERVICE_SOCKET= -e UNBROWSER_COOKIE_SERVICE_TOKEN="
            EXPECTED_SOCKET_METADATA="600:$(id -u):$(id -g)"
            SOCKET_METADATA=$(stat -c '%a:%u:%g' "$REDDIT_SOCKET" 2>/dev/null || true)

            if [ -S "$REDDIT_SOCKET" ] && [ "$SOCKET_METADATA" = "$EXPECTED_SOCKET_METADATA" ]; then
              echo "Checking cookie-backed Unbrowser Reddit access before replacing containers..."
              if docker run --rm \
                --network crypto-sentiment_crypto-net \
                $CRAWLER_ENV_ARGS \
                -v "$REDDIT_SOCKET":/run/reddit-cookie-solver.sock:ro \
                -e REDDIT_FETCH_MODE=unbrowser \
                -e UNBROWSER_COOKIE_SERVICE_SOCKET=/run/reddit-cookie-solver.sock \
                crypto-sentiment-crawler:current \
              uv run python -c '
            import asyncio

            from crypto_sentiment_crawler.crawler.fetcher import Fetcher


            async def main() -> None:
                async with Fetcher(randomize_delay=False) as fetcher:
                    if fetcher.reddit_transport is None:
                        raise RuntimeError("Reddit Unbrowser transport was not configured")
                    cookies = await asyncio.to_thread(
                        fetcher.reddit_transport._request_cookies,
                        "https://old.reddit.com/r/Bitcoin/new/",
                    )
                    if not cookies:
                        raise RuntimeError("Reddit cookie solver returned no cookies")
                    result = await fetcher.fetch(
                        "https://old.reddit.com/r/Bitcoin/new/",
                        rate_limit=1.0,
                    )
                if result.status_code != 200 or "data-timestamp" not in result.content:
                    raise RuntimeError(f"Reddit Unbrowser canary failed (status={result.status_code})")


            asyncio.run(main())
            '; then
                REDDIT_CRAWLER_ARGS="-v $REDDIT_SOCKET:/run/reddit-cookie-solver.sock:ro -e REDDIT_FETCH_MODE=unbrowser -e UNBROWSER_COOKIE_SERVICE_SOCKET=/run/reddit-cookie-solver.sock"
                echo "Reddit Unbrowser canary passed."
              else
                echo "WARNING: Reddit Unbrowser canary failed; deploying with standard Reddit fetching."
              fi
            else
              echo "WARNING: Reddit cookie solver socket is unavailable or has unsafe permissions ($SOCKET_METADATA; expected $EXPECTED_SOCKET_METADATA); deploying with standard Reddit fetching."
            fi

            # ========== SYNC CONFIG FILES ==========
            mkdir -p /opt/crypto-sentiment/dashboard-frontend
            cp dashboard-frontend/blocklist.conf /opt/crypto-sentiment/dashboard-frontend/blocklist.conf

            # ========== STOP OLD CONTAINERS ==========
            # Keep stopped containers until the replacement set passes health
            # checks so a failed rollout can restore the known-good set.
            SERVICES="crypto-crawler crypto-api crypto-frontend crypto-signals crypto-game-server"
            PREVIOUS_SERVICES=""
            for service in $SERVICES; do
              if docker inspect "$service-previous" >/dev/null 2>&1; then
                echo "ERROR: Stale rollback container exists: $service-previous"
                exit 1
              fi
              if docker inspect "$service" >/dev/null 2>&1; then
                PREVIOUS_SERVICES="$PREVIOUS_SERVICES $service"
              fi
            done

            ROLLBACK_ACTIVE=1
            NEW_CONTAINERS_STARTED=0
            rollback_on_exit() {
              exit_code=$?
              if [ "$exit_code" -eq 0 ] || [ "$ROLLBACK_ACTIVE" -ne 1 ]; then
                return "$exit_code"
              fi

              echo "Deployment failed; restoring previous containers..."
              ROLLBACK_ACTIVE=0
              if [ "$NEW_CONTAINERS_STARTED" -eq 1 ]; then
                for service in $SERVICES; do
                  docker rm -f "$service" >/dev/null 2>&1 || true
                done
              fi
              for service in $PREVIOUS_SERVICES; do
                if docker inspect "$service-previous" >/dev/null 2>&1; then
                  docker rename "$service-previous" "$service" || true
                  docker start "$service" >/dev/null 2>&1 || true
                elif docker inspect "$service" >/dev/null 2>&1; then
                  docker start "$service" >/dev/null 2>&1 || true
                fi
              done
              return "$exit_code"
            }
            trap 'rollback_on_exit' 0

            # The current service set no longer includes belief-auto.
            docker stop crypto-belief-auto 2>/dev/null || true
            docker rm crypto-belief-auto 2>/dev/null || true

            echo "Stopping old containers..."
            for service in $PREVIOUS_SERVICES; do
              docker stop "$service"
              docker rename "$service" "$service-previous"
            done
            NEW_CONTAINERS_STARTED=1

            # ========== START SERVICES ==========
            echo "Starting API..."
            docker run -d --name crypto-api --restart unless-stopped \
              -p 8000:8000 \
              --network crypto-sentiment_crypto-net \
              --network-alias api \
              -v /opt/crypto-sentiment/data:/app/data \
              -v /opt/crypto-sentiment/logs:/app/logs \
              -e DATABASE_PATH=/app/data/sentiment.db \
              crypto-sentiment-api:current

            # Wait for API to be healthy with actual health check
            echo "Waiting for API to be healthy..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "API is healthy!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "ERROR: API failed to become healthy"
                docker logs crypto-api --tail 50
                exit 1
              fi
              echo "Waiting for API... ($i/30)"
              sleep 2
            done

            echo "Starting game server..."
            docker run -d --name crypto-game-server --restart unless-stopped \
              --network crypto-sentiment_crypto-net \
              --network-alias game-server \
              --cpus 0.5 \
              --memory 256m \
              --pids-limit 50 \
              -e NODE_ENV=production \
              -e ALLOWED_ORIGINS=https://panicradar.ai,https://www.panicradar.ai \
              crypto-sentiment-game-server:current

            # Wait for game server health
            echo "Waiting for game server to be healthy..."
            for i in $(seq 1 15); do
              GAME_HEALTH=$(docker inspect --format '{{.State.Health.Status}}' crypto-game-server 2>/dev/null || echo "missing")
              if [ "$GAME_HEALTH" = "healthy" ]; then
                echo "Game server is healthy!"
                break
              fi
              if [ $i -eq 15 ]; then
                echo "ERROR: Game server health check failed (status: $GAME_HEALTH)"
                docker logs crypto-game-server --tail 50
                exit 1
              fi
              sleep 2
            done

            # Nginx resolves the game-server network alias at startup, so the
            # upstream container must be healthy before frontend starts.
            echo "Starting frontend..."
            docker run -d --name crypto-frontend --restart unless-stopped \
              -p 80:80 -p 443:443 \
              --network crypto-sentiment_crypto-net \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              -v /opt/crypto-sentiment/logs:/var/log/nginx \
              -v /opt/crypto-sentiment/dashboard-frontend/blocklist.conf:/etc/nginx/conf.d/blocklist.conf:ro \
              crypto-sentiment-frontend:current

            echo "Starting crawler..."
            docker run -d --name crypto-crawler --restart unless-stopped \
              --network crypto-sentiment_crypto-net \
              $CRAWLER_ENV_ARGS \
              -v /opt/crypto-sentiment/data:/app/data \
              -v /opt/crypto-sentiment/logs:/app/logs \
              -e DATABASE_PATH=/app/data/sentiment.db \
              -e PROXY_URL= \
              $REDDIT_CRAWLER_ARGS \
              crypto-sentiment-crawler:current \
              uv run crawler background --crawl-interval 60

            echo "Starting signals bot..."
            docker run -d --name crypto-signals --restart unless-stopped \
              --network crypto-sentiment_crypto-net \
              -v /opt/crypto-sentiment/data:/app/data \
              -v /opt/crypto-sentiment/logs:/app/logs \
              -e TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }} \
              -e DB_PATH=/app/data/sentiment.db \
              -e SIGNAL_CHECK_INTERVAL=30 \
              -e TELEGRAM_CHANNEL_ID=@PanicRadarAlerts \
              crypto-sentiment-crawler:current \
              uv run signals bot

            # ========== POST-DEPLOY CLEANUP ==========
            echo "Cleaning up unused images..."
            docker image prune -af

            echo "Post-deploy disk usage:"
            df -h /

            # ========== VERIFY DEPLOYMENT ==========
            echo "Verifying all containers are running..."
            sleep 5

            RUNNING=$(docker ps --format '{{.Names}}' | grep -E '^crypto-(api|frontend|crawler|signals|game-server)$' | wc -l)
            if [ "$RUNNING" -ne 5 ]; then
              echo "ERROR: Not all containers are running!"
              docker ps -a
              exit 1
            fi

            ROLLBACK_ACTIVE=0
            for service in $PREVIOUS_SERVICES; do
              docker rm "$service-previous" >/dev/null 2>&1 || true
            done
            trap - 0

            for component in crawler api frontend game-server; do
              docker tag "crypto-sentiment-$component:current" "crypto-sentiment-$component:latest"
            done

            echo "All 5 containers running. Checking frontend..."
            if ! curl -sf -o /dev/null https://localhost --insecure 2>/dev/null; then
              echo "WARNING: Frontend HTTPS check failed (may be normal if cert issue)"
            fi

            # ========== SETUP CRON ==========
            chmod +x deploy/backup-db.sh
            chmod +x scripts/daily_traffic_report.sh
            sudo mkdir -p /opt/crypto-sentiment/reports

            BACKUP_CRON="0 0 * * * /home/ec2-user/crypto_sentiment_crawler/deploy/backup-db.sh >> /opt/crypto-sentiment/logs/backup.log 2>&1"
            TRAFFIC_CRON="5 0 * * * REPORT_EMAIL_TO=protostatis.dev@gmail.com REPORT_EMAIL_FROM=protostatis.dev@gmail.com /home/ec2-user/crypto_sentiment_crawler/scripts/daily_traffic_report.sh >> /opt/crypto-sentiment/logs/traffic_report.log 2>&1"
            MORNING_TRAFFIC_CRON="0 12 * * * REPORT_EMAIL_TO=protostatis.dev@gmail.com REPORT_EMAIL_FROM=protostatis.dev@gmail.com /home/ec2-user/crypto_sentiment_crawler/scripts/daily_traffic_report.sh --date \$(date -u +\%Y-\%m-\%d) >> /opt/crypto-sentiment/logs/traffic_report.log 2>&1"
            (crontab -l 2>/dev/null | grep -v "backup-db.sh" | grep -v "daily_traffic_report.sh"; echo "$BACKUP_CRON"; echo "$TRAFFIC_CRON"; echo "$MORNING_TRAFFIC_CRON") | crontab -

            echo "========== DEPLOYMENT COMPLETE =========="
            docker ps

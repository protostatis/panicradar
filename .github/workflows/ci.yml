name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linting
        run: uv run ruff check . || true  # 353 pre-existing lint findings — fix in dedicated cleanup PR

      - name: Run type checking
        run: uv run mypy crypto_sentiment_crawler --ignore-missing-imports

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            dashboard-frontend/package-lock.json
            dashboard-frontend/game/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install game dependencies
        working-directory: dashboard-frontend/game
        run: npm ci

      - name: Lint game
        working-directory: dashboard-frontend/game
        run: npm run lint

      - name: Test game
        working-directory: dashboard-frontend/game
        run: npm test

      - name: Build game
        working-directory: dashboard-frontend/game
        run: npm run build

      - name: Install game server dependencies
        working-directory: dashboard-frontend/game/server
        run: npm ci

      - name: Test game server
        working-directory: dashboard-frontend/game/server
        run: npm test

      - name: Check game server entrypoint
        working-directory: dashboard-frontend/game/server
        run: node --check index.js

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build crawler image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: crawler
          push: false
          tags: crypto-sentiment-crawler:test
          build-args: |
            TORCH_BASE_IMAGE=ghcr.io/protostatis/crypto-sentiment-torch-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          tags: crypto-sentiment-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard-frontend
          target: production
          push: false
          tags: crypto-sentiment-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build game server image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard-frontend/game
          file: ./dashboard-frontend/game/server/Dockerfile
          push: false
          tags: crypto-sentiment-game-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

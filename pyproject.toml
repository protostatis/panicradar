[project]
name = "crypto-sentiment-crawler"
version = "0.1.0"
description = "Collect live crypto sentiment data to predict price movements"
readme = "roadmap.md"
requires-python = ">=3.11"
dependencies = [
    # HTTP & Parsing
    "httpx>=0.24.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pyunbrowser==0.0.14",
    # Reddit API (backup)
    "asyncpraw>=7.7.0",
    # Sentiment Analysis
    "vaderSentiment>=3.3.2",
    # Database
    "aiosqlite==0.17.0",
    # Scheduling
    "apscheduler>=3.10.0",
    # Data Processing
    "pandas>=2.0.0",
    # Configuration
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    # Utilities
    "tenacity>=8.2.0",
    # Bayesian & Causal
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "transformers>=5.0.0",
    "torch>=2.10.0",
    # API Server
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "yfinance>=1.1.0",
    "sentence-transformers>=5.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
crawler = "crypto_sentiment_crawler.main:main"
signals = "crypto_sentiment_crawler.signals.cli:main"
tasks = "crypto_sentiment_crawler.taskmanager:main"
beliefs = "crypto_sentiment_crawler.live_beliefs:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crypto_sentiment_crawler"]

[project]
name = "crypto-sentiment-api"
version = "0.1.0"
description = "API server for crypto sentiment dashboard"
readme = "roadmap.md"
requires-python = ">=3.11"
dependencies = [
    # API Server
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    # Database
    "aiosqlite==0.17.0",
    # HTTP
    "aiohttp>=3.9.0",
    "httpx>=0.24.0",
    # Data Processing
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    # Calculations
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    # Coin prices
    "yfinance>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crypto_sentiment_crawler"]
